name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install linters
        run: pip install ruff==0.6.2 black==24.8.0

      - name: ruff check
        run: ruff check src/ tests/ frontend/ scripts/

      - name: black check
        run: black --check --diff src/ tests/ frontend/ scripts/

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install PyTorch (CPU)
        run: pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt
        env:
          # Skip CUDA bitsandbytes build on CPU runner
          BNB_CUDA_VERSION: ""

      - name: Run unit tests
        run: pytest tests/unit/ -v
        env:
          WANDB_DISABLED: "true"
          TOKENIZERS_PARALLELISM: "false"
          HF_DATASETS_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
